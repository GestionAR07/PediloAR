name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Format pre-pilot files
        run: >-
          npx prettier --write
          README.md
          docs/CHECKPOINTS.md
          docs/E2E.md
          docs/MERCHANT_ONBOARDING.md
          docs/ROADMAP.md
          src/app/sumar-comercio/page.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: pre-pilot-prettier-output
          path: |
            README.md
            docs/CHECKPOINTS.md
            docs/E2E.md
            docs/MERCHANT_ONBOARDING.md
            docs/ROADMAP.md
            src/app/sumar-comercio/page.tsx

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smokes
        run: npm run e2e
